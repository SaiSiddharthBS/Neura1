[project]
name = "neura1"
version = "0.1.0"
description = "Neura1: change-impact company brain for hardware companies, built on FalkorDB"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = [
    "falkordb>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "openai>=1.57.0",
    "pyyaml>=6.0",
    "pypdf>=6.20.1",
    "python-multipart>=0.0.32",
    "mcp>=1.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "playwright>=1.64.0",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neura1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
