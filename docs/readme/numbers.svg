<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d">
<title id="t">Builds at risk and query timings</title>
<desc id="d">Parts needed per planned build, split into free stock and shortfall, and the time taken by each of the 13 Cypher queries in one impact analysis (25.6 ms total).</desc>
<style>
:root{--bg1:#f2f6f8;--bg2:#e9f0f3;--ink:#0d1b22;--muted:#55666f;--grid:rgba(13,27,34,.08);--glass:rgba(255,255,255,.6);--edge:rgba(255,255,255,.95);--stock:#11a37f;--short:#e0901b;--bar:#1597b8;--hi:#5b6cff;--shadow:rgba(16,40,52,.1);--b1:#9fe6d2;--b2:#c3ccff}
@media (prefers-color-scheme:dark){:root{--bg1:#081218;--bg2:#0c1a21;--ink:#e8f5fa;--muted:#9db3bd;--grid:rgba(255,255,255,.07);--glass:rgba(255,255,255,.06);--edge:rgba(255,255,255,.18);--stock:#2fd3a5;--short:#f4b04a;--bar:#3fc6e6;--hi:#8c99ff;--shadow:rgba(0,0,0,.5);--b1:#0d5e4c;--b2:#2e3786}}
text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink)}
.h{font-size:17px;font-weight:700} .sub{font-size:12.5px;fill:var(--muted)} .lab{font-size:13px;font-weight:600} .sm{font-size:11.5px;fill:var(--muted)}
.mono{font:500 11px ui-monospace,"SF Mono",Menlo,Consolas,monospace;fill:var(--muted)} .val{font:600 12px ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
.panel{fill:var(--glass);stroke:var(--edge);stroke-width:1.2;filter:url(#sh)} .grid{stroke:var(--grid);stroke-width:1}
.grow{transform-box:fill-box;transform-origin:left;animation:g 1s cubic-bezier(.2,.8,.2,1) both} .up{transform-box:fill-box;transform-origin:bottom;animation:u 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes g{from{transform:scaleX(0)}} @keyframes u{from{transform:scaleY(0)}}
@media (prefers-reduced-motion:reduce){.grow,.up{animation:none}}
</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--bg1)"/><stop offset="1" style="stop-color:var(--bg2)"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="12" style="flood-color:var(--shadow)"/></filter>
<filter id="bl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
<clipPath id="fr"><rect width="1200" height="400" rx="24"/></clipPath></defs>
<g clip-path="url(#fr)"><rect width="1200" height="400" fill="url(#bg)"/>
<circle cx="200" cy="330" r="170" filter="url(#bl)" opacity=".55" style="fill:var(--b1)"/><circle cx="1000" cy="80" r="170" filter="url(#bl)" opacity=".55" style="fill:var(--b2)"/>

<rect class="panel" x="30" y="30" width="600" height="340" rx="20"/>
<text class="h" x="54" y="68">Parts needed per planned build</text>
<text class="sub" x="54" y="90">NB54360 · 60 free in stock · new supply ordered today lands ~19 Mar 2027</text>
<line class="grid" x1="224.0" y1="116" x2="224.0" y2="312"/><text class="mono" x="224.0" y="328" text-anchor="middle">0</text>
<line class="grid" x1="339.3" y1="116" x2="339.3" y2="312"/><text class="mono" x="339.3" y="328" text-anchor="middle">100</text>
<line class="grid" x1="454.7" y1="116" x2="454.7" y2="312"/><text class="mono" x="454.7" y="328" text-anchor="middle">200</text>
<line class="grid" x1="570.0" y1="116" x2="570.0" y2="312"/><text class="mono" x="570.0" y="328" text-anchor="middle">300</text>
<text class="lab" x="54" y="141">BO-0412</text><text class="sm" x="54" y="158">PDU-28 C × 100 · 3 Nov</text>
<rect class="grow" x="224" y="128" width="69.2" height="30" rx="7" style="fill:var(--stock);animation-delay:0.0s"/>
<rect class="grow" x="293.2" y="128" width="276.8" height="30" rx="7" style="fill:var(--short);animation-delay:0.1s"/>
<text class="val" x="578.0" y="148">300</text>
<text class="lab" x="54" y="205">BO-0415</text><text class="sm" x="54" y="222">BCU-24 A × 60 · 10 Nov</text>
<rect class="grow" x="224.0" y="192" width="69.2" height="30" rx="7" style="fill:var(--short);animation-delay:0.22s"/>
<text class="val" x="301.2" y="212">60</text>
<text class="lab" x="54" y="269">BO-0421</text><text class="sm" x="54" y="286">PDU-28 C × 40 · 24 Nov</text>
<rect class="grow" x="224.0" y="256" width="138.4" height="30" rx="7" style="fill:var(--short);animation-delay:0.33999999999999997s"/>
<text class="val" x="370.4" y="276">120</text>
<rect x="54" y="346" width="12" height="12" rx="3" style="fill:var(--stock)"/><text class="sm" x="72" y="356">from free stock</text><rect x="190" y="346" width="12" height="12" rx="3" style="fill:var(--short)"/><text class="sm" x="208" y="356">shortfall · 420 parts to buy</text>
<rect class="panel" x="650" y="30" width="520" height="340" rx="20"/>
<text class="h" x="674" y="68">13 Cypher queries · 25.6 ms</text>
<text class="sub" x="674" y="90">One full impact analysis on FalkorDB, ms per query.</text>
<text class="sub" x="674" y="108">Highlighted: where-used traversal and decision lookup.</text>
<line class="grid" x1="690" y1="266.0" x2="1146" y2="266.0"/><text class="mono" x="682" y="270.0" text-anchor="end">0</text>
<line class="grid" x1="690" y1="240.4" x2="1146" y2="240.4"/><text class="mono" x="682" y="244.4" text-anchor="end">1</text>
<line class="grid" x1="690" y1="214.8" x2="1146" y2="214.8"/><text class="mono" x="682" y="218.8" text-anchor="end">2</text>
<line class="grid" x1="690" y1="189.2" x2="1146" y2="189.2"/><text class="mono" x="682" y="193.2" text-anchor="end">3</text>
<line class="grid" x1="690" y1="163.6" x2="1146" y2="163.6"/><text class="mono" x="682" y="167.6" text-anchor="end">4</text>
<line class="grid" x1="690" y1="138.0" x2="1146" y2="138.0"/><text class="mono" x="682" y="142.0" text-anchor="end">5</text>
<rect class="up" x="696.7" y="235.3" width="21.7" height="30.7" rx="5" style="fill:var(--bar);animation-delay:0.00s"/>
<text class="mono" transform="translate(710.5,276) rotate(55)" font-size="10">resolve_item</text>
<rect class="up" x="731.7" y="232.7" width="21.7" height="33.3" rx="5" style="fill:var(--bar);animation-delay:0.05s"/>
<text class="mono" transform="translate(745.6,276) rotate(55)" font-size="10">owners</text>
<rect class="up" x="766.8" y="189.2" width="21.7" height="76.8" rx="5" style="fill:var(--hi);animation-delay:0.10s"/>
<text class="mono" transform="translate(780.7,276) rotate(55)" font-size="10">where_used</text>
<rect class="up" x="801.9" y="196.9" width="21.7" height="69.1" rx="5" style="fill:var(--bar);animation-delay:0.15s"/>
<text class="mono" transform="translate(815.8,276) rotate(55)" font-size="10">exposure</text>
<rect class="up" x="837.0" y="225.0" width="21.7" height="41.0" rx="5" style="fill:var(--bar);animation-delay:0.20s"/>
<text class="mono" transform="translate(850.8,276) rotate(55)" font-size="10">field_units</text>
<rect class="up" x="872.0" y="202.0" width="21.7" height="64.0" rx="5" style="fill:var(--bar);animation-delay:0.25s"/>
<text class="mono" transform="translate(885.9,276) rotate(55)" font-size="10">dependents</text>
<rect class="up" x="907.1" y="196.9" width="21.7" height="69.1" rx="5" style="fill:var(--bar);animation-delay:0.30s"/>
<text class="mono" transform="translate(921.0,276) rotate(55)" font-size="10">direct_parents</text>
<rect class="up" x="942.2" y="225.0" width="21.7" height="41.0" rx="5" style="fill:var(--bar);animation-delay:0.35s"/>
<text class="mono" transform="translate(956.1,276) rotate(55)" font-size="10">quotes</text>
<rect class="up" x="977.3" y="230.2" width="21.7" height="35.8" rx="5" style="fill:var(--bar);animation-delay:0.40s"/>
<text class="mono" transform="translate(991.2,276) rotate(55)" font-size="10">alternates</text>
<rect class="up" x="1012.4" y="158.5" width="21.7" height="107.5" rx="5" style="fill:var(--hi);animation-delay:0.45s"/>
<text class="mono" transform="translate(1026.2,276) rotate(55)" font-size="10">decisions</text>
<rect class="up" x="1047.4" y="232.7" width="21.7" height="33.3" rx="5" style="fill:var(--bar);animation-delay:0.50s"/>
<text class="mono" transform="translate(1061.3,276) rotate(55)" font-size="10">policy</text>
<rect class="up" x="1082.5" y="235.3" width="21.7" height="30.7" rx="5" style="fill:var(--bar);animation-delay:0.55s"/>
<text class="mono" transform="translate(1096.4,276) rotate(55)" font-size="10">alt_quotes</text>
<rect class="up" x="1117.6" y="243.0" width="21.7" height="23.0" rx="5" style="fill:var(--bar);animation-delay:0.60s"/>
<text class="mono" transform="translate(1131.5,276) rotate(55)" font-size="10">alt_quotes</text>
</g></svg>