<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 210" width="1280" height="210" role="img" aria-label="15 of 18 blind questions answered by the graph agent (search alone: 10); a scenario sandbox copies the company graph in 0.1 seconds; 104 documented Cypher queries; 103 automated tests; zero cloud cost.">
  <defs>
    <clipPath id="c"><rect width="1280" height="210" rx="26"/></clipPath>
    <linearGradient id="n" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#9db4ff"/></linearGradient>
    <radialGradient id="g" cx="50%" cy="0%" r="70%"><stop offset="0" stop-color="#3b6cff" stop-opacity=".3"/><stop offset="1" stop-color="#3b6cff" stop-opacity="0"/></radialGradient>
    <style>
      .t { font-family: Inter, "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .num { font-size: 46px; font-weight: 800; letter-spacing: -1.5px; fill: url(#n); }
      .lab { font-size: 13.5px; fill: #c3cbe0; }
      .sub { font-size: 12px; fill: #8590aa; }
    </style>
  </defs>
  <g clip-path="url(#c)" class="t">
    <rect width="1280" height="210" fill="#05060b"/><rect width="1280" height="210" fill="url(#g)"/>
    <g stroke="#ffffff" stroke-opacity=".1"><line x1="256" y1="40" x2="256" y2="170"/><line x1="512" y1="40" x2="512" y2="170"/><line x1="768" y1="40" x2="768" y2="170"/><line x1="1024" y1="40" x2="1024" y2="170"/></g>
    <g text-anchor="middle">
      <text x="128" y="104" class="num">15/18</text><text x="128" y="134" class="lab">blind questions answered</text><text x="128" y="154" class="sub">graph agent · search alone: 10</text>
      <text x="384" y="104" class="num">0.1 s</text><text x="384" y="134" class="lab">to copy the whole company</text><text x="384" y="154" class="sub">FalkorDB GRAPH.COPY sandbox</text>
      <text x="640" y="104" class="num">110</text><text x="640" y="134" class="lab">Cypher queries, documented</text><text x="640" y="154" class="sub">generated from the code</text>
      <text x="896" y="104" class="num">117</text><text x="896" y="134" class="lab">automated tests</text><text x="896" y="154" class="sub">permissions, maths, verification</text>
      <text x="1152" y="104" class="num">₹0</text><text x="1152" y="134" class="lab">cloud and API cost</text><text x="1152" y="154" class="sub">open models, own hardware</text>
    </g>
    <rect x=".5" y=".5" width="1279" height="209" rx="25.5" fill="none" stroke="#ffffff" stroke-opacity=".12"/>
  </g>
</svg>
