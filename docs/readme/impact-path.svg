<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="t d">
  <title id="t">How one part change travels through Flyvi's graph</title>
  <desc id="d">NB54360 is contained twice in PSM-28 Rev 2 and once directly in PDU-28 Rev C, which build BO-0412 builds for order SO-881 from Nilgiri Aero Systems with a penalty clause. The cheaper NB54361-L was rejected in DEC-117. Firmware pmic_seq.c and test TP-PSM-07 depend on the part. Draft Rev D and obsolete Rev B are excluded.</desc>
  <style>
    :root { --bg1:#f2f6f8; --bg2:#e9f0f3; --ink:#0d1b22; --muted:#55666f; --glass:rgba(255,255,255,.6); --edge:rgba(255,255,255,.95); --line:#7fa7b6; --flow:#0e8fb0; --red:#d03a2e; --redglass:rgba(255,226,222,.75); --amber:#b26b00; --amberglass:rgba(255,240,214,.75); --shadow:rgba(16,40,52,.10); --b1:#8fe0ee; --b2:#b3c3ff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg1:#081218; --bg2:#0c1a21; --ink:#e8f5fa; --muted:#9db3bd; --glass:rgba(255,255,255,.07); --edge:rgba(255,255,255,.2); --line:#3d6070; --flow:#43d3f0; --red:#ff8073; --redglass:rgba(255,90,70,.14); --amber:#f2b453; --amberglass:rgba(255,180,60,.12); --shadow:rgba(0,0,0,.5); --b1:#0f6f86; --b2:#36409a; }
    }
    text { font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Helvetica,Arial,sans-serif; }
    .t { font-size:15px; font-weight:650; fill:var(--ink); }
    .s { font-size:12.5px; fill:var(--muted); }
    .m { font:500 12px ui-monospace,"SF Mono",Menlo,Consolas,monospace; fill:var(--muted); }
    .g { fill:var(--glass); stroke:var(--edge); stroke-width:1.2; filter:url(#sh); }
    .gr { fill:var(--redglass); stroke:var(--red); stroke-width:1.4; filter:url(#sh); }
    .ga { fill:var(--amberglass); stroke:var(--amber); stroke-width:1.2; filter:url(#sh); }
    .gx { fill:var(--glass); stroke:var(--line); stroke-dasharray:5 5; stroke-width:1.2; opacity:.65; }
    .changed { stroke:var(--red); stroke-width:2.2; }
    .base { fill:none; stroke:var(--line); stroke-width:1.6; }
    .flow { fill:none; stroke:var(--flow); stroke-width:2.4; stroke-linecap:round; stroke-dasharray:6 14; animation:run 1.6s linear infinite; }
    .no { fill:none; stroke:var(--red); stroke-width:2; stroke-dasharray:4 6; }
    .lbl { font:600 11px ui-monospace,"SF Mono",Menlo,Consolas,monospace; fill:var(--flow); }
    .tr { fill:var(--red); } .ta { fill:var(--amber); }
    .blob { filter:url(#bl); opacity:.6; }
    @keyframes run { to { stroke-dashoffset:-40; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation:none; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--bg1)"/><stop offset="1" style="stop-color:var(--bg2)"/></linearGradient>
    <filter id="sh" x="-10%" y="-20%" width="120%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="9" style="flood-color:var(--shadow)"/></filter>
    <filter id="bl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <clipPath id="fr"><rect width="1200" height="380" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#fr)">
  <rect width="1200" height="380" fill="url(#bg)"/>
  <circle class="blob" cx="300" cy="80" r="160" style="fill:var(--b1)"/>
  <circle class="blob" cx="980" cy="300" r="170" style="fill:var(--b2)"/>

  <!-- main chain connectors -->
  <path class="base" d="M200 110 H230"/><path class="flow" d="M200 110 H230"/>
  <path class="base" d="M390 110 H420"/><path class="flow" d="M390 110 H420"/>
  <path class="base" d="M580 110 H610"/><path class="flow" d="M580 110 H610"/>
  <path class="base" d="M770 110 H800"/><path class="flow" d="M770 110 H800"/>
  <path class="base" d="M960 110 H990"/><path class="flow" d="M960 110 H990"/>
  <!-- direct U12 placement -->
  <path class="base" d="M150 76 C150 36, 500 36, 500 76"/><path class="flow" d="M150 76 C150 36, 500 36, 500 76"/>
  <text class="lbl" x="290" y="38">× 1 direct (U12)</text>
  <text class="lbl" x="203" y="100">×2</text>

  <!-- branches below -->
  <path class="base" d="M80 144 V230"/><path class="no" d="M200 262 H230"/>
  <path class="base" d="M150 144 C150 200, 525 190, 525 230"/><path class="flow" d="M150 144 C150 200, 525 190, 525 230"/>
  <path class="base" d="M170 144 C170 210, 700 190, 700 230"/><path class="flow" d="M170 144 C170 210, 700 190, 700 230"/>
  <path class="base" d="M500 144 C500 190, 880 190, 880 230" style="stroke-dasharray:4 5"/>
  <path class="base" d="M520 144 C520 186, 1070 186, 1070 230" style="stroke-dasharray:4 5"/>

  <!-- top row -->
  <rect class="g changed" x="40" y="76" width="160" height="68" rx="18"/>
  <text class="t" x="58" y="104">NB54360</text><text class="s" x="58" y="126">₹250 → ₹320 · 22 wk</text>
  <rect class="g" x="230" y="76" width="160" height="68" rx="18"/>
  <text class="t" x="248" y="104">PSM-28 Rev 2</text><text class="s" x="248" y="126">power module · Raghavendra</text>
  <rect class="g" x="420" y="76" width="160" height="68" rx="18"/>
  <text class="t" x="438" y="104">PDU-28 Rev C</text><text class="s" x="438" y="126">released · 3 per unit</text>
  <rect class="ga" x="610" y="76" width="160" height="68" rx="18"/>
  <text class="t" x="628" y="104">BO-0412</text><text class="s ta" x="628" y="126">100 units · short 240</text>
  <rect class="g" x="800" y="76" width="160" height="68" rx="18"/>
  <text class="t" x="818" y="104">SO-881</text><text class="s" x="818" y="126">80 units · due 20 Nov</text>
  <rect class="ga" x="990" y="76" width="170" height="68" rx="18"/>
  <text class="t" x="1008" y="104">Nilgiri Aero</text><text class="s ta" x="1008" y="126">penalty clause 9.2</text>

  <!-- bottom row -->
  <rect class="g" x="40" y="230" width="160" height="68" rx="18"/>
  <text class="t" x="58" y="258">NB54361-L</text><text class="s" x="58" y="280">₹190 · "pin-compatible"</text>
  <rect class="gr" x="230" y="230" width="200" height="68" rx="18"/>
  <text class="t tr" x="248" y="258">✕ DEC-117 rejected</text><text class="s" x="248" y="280">Vishwas · Slack + HW-311</text>
  <rect class="g" x="445" y="230" width="160" height="68" rx="18"/>
  <text class="t" x="463" y="258">pmic_seq.c</text><text class="s" x="463" y="280">firmware · Sai</text>
  <rect class="g" x="620" y="230" width="160" height="68" rx="18"/>
  <text class="t" x="638" y="258">TP-PSM-07</text><text class="s" x="638" y="280">requalify · Satish</text>
  <rect class="gx" x="800" y="230" width="160" height="68" rx="18"/>
  <text class="t" x="818" y="258">PDU-28 Rev D</text><text class="s" x="818" y="280">draft · excluded</text>
  <rect class="gx" x="990" y="230" width="170" height="68" rx="18"/>
  <text class="t" x="1008" y="258">PDU-28 Rev B</text><text class="s" x="1008" y="280">obsolete · 220 in field</text>

  <text class="m" x="40" y="346">MATCH p = (top:Revision)-[:CONTAINS*1..8]-&gt;(part)  ·  reduce(q = 1, r IN relationships(p) | q * r.qty)  ·  13 queries · 25.6 ms</text>
  </g>
</svg>
